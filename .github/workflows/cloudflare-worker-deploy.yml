name: Cloudflare Worker deploy (city sites)

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "cloudflare/**"
      - "sites-config.json"
      - "CLOUDFLARE-SITES*.md"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare credentials
        id: cloudflare-token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Cloudflare deploy because CLOUDFLARE_API_TOKEN is not configured."
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.cloudflare-token.outputs.present == 'true'

      - uses: actions/setup-node@v4
        if: steps.cloudflare-token.outputs.present == 'true'
        with:
          node-version: 22

      - name: Install wrangler
        if: steps.cloudflare-token.outputs.present == 'true'
        run: npm i -g wrangler

      - name: Sync KV + deploy
        if: steps.cloudflare-token.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node cloudflare/worker/scripts/deploy.mjs all

