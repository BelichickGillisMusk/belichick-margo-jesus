name: Cloudflare Worker deploy (city sites)

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "cloudflare/**"
      - "sites-config.json"
      - "CLOUDFLARE-SITES*.md"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # The `secrets` context isn't allowed in job-level `if` conditions, so
      # we gate at the step level instead. Without this guard, every push
      # registers a failed run for this file (workflow validation error).
      - name: Check for Cloudflare API token
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN secret not set — skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4

      - if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install wrangler
        if: steps.gate.outputs.skip != 'true'
        run: npm i -g wrangler

      - name: Sync KV + deploy
        if: steps.gate.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node cloudflare/worker/scripts/deploy.mjs all

