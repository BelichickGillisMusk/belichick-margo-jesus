name: Deploy Mila to Cloud Run

# Deploys the Mila CARB chatbot to Cloud Run in Bryan's GCP project.
# Mila calls Claude (Haiku) via Vertex AI using the Cloud Run service
# account's identity — no ANTHROPIC_API_KEY needed. Mirrors the Samantha
# deploy so both agents live in the same "samantha" GCP project by default.
#
# One-time GCP setup (re-uses the Samantha project + IAM):
#   See .github/workflows/deploy-samantha-cloud-run.yml for the gcloud
#   commands. The Mila Cloud Run runtime uses the same
#   "samantha@<project>.iam.gserviceaccount.com" service account by default
#   (which already has roles/aiplatform.user). No new GCP setup needed.
#
# Required repo secrets:
#   GCP_SA_KEY              Same as for Samantha — JSON key for the deploy
#                           service account.
#
# Optional repo variables:
#   GCP_PROJECT_ID            defaults to "samantha"
#   GCP_REGION                defaults to "us-east5" (Claude on Vertex region)
#   MILA_CLOUD_RUN_SERVICE    defaults to "mila"
#   MILA_RUNTIME_SA           defaults to "samantha@<project>.iam.gserviceaccount.com"

on:
  # Manual trigger from the Actions tab — use this to redeploy on demand
  # without a code change (e.g. after rotating GCP_SA_KEY).
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/mila-chatbot/**'
      - 'src/shared/**'
      - 'skills/mila-carb-cs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-mila-cloud-run.yml'

concurrency:
  group: deploy-mila-cloud-run
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'samantha' }}
      REGION: ${{ vars.GCP_REGION || 'us-east5' }}
      SERVICE: ${{ vars.MILA_CLOUD_RUN_SERVICE || 'mila' }}

    steps:
      - name: Guard against missing repo secrets
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "::error::Missing required repo secret: GCP_SA_KEY"
            echo "Add it at Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          version: '>= 470.0.0'

      - name: Deploy from source to Cloud Run
        run: |
          runtime_sa="${{ vars.MILA_RUNTIME_SA }}"
          if [ -z "$runtime_sa" ]; then
            runtime_sa="samantha@${PROJECT_ID}.iam.gserviceaccount.com"
          fi
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --source src/mila-chatbot \
            --service-account "$runtime_sa" \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --set-env-vars "ANTHROPIC_VERTEX_PROJECT_ID=${PROJECT_ID},CLOUD_ML_REGION=${REGION}" \
            --quiet

      - name: Verify Mila's brain is connected
        run: |
          url=$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --format='value(status.url)')
          echo "Mila URL: $url"
          health=$(curl -fsSL "$url/health")
          echo "$health" | grep -q '"backend":"vertex-ai"' || {
            echo "::error::Mila deployed but /health does not report backend=vertex-ai";
            exit 1;
          }
          echo "Mila is online at $url"
