name: Deploy Pages
on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'carbteststockton/**'
      - 'cleantruckcheckroseville/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    outputs:
      has_token: ${{ steps.check.outputs.has_token }}
      has_account: ${{ steps.check.outputs.has_account }}
      token_name: ${{ steps.check.outputs.token_name }}
      account_name: ${{ steps.check.outputs.account_name }}
    steps:
      - name: Check required secrets (accept multiple name variants)
        id: check
        env:
          TOK_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOK_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          TOK_CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          TOK_CF_TOKEN: ${{ secrets.CF_TOKEN }}
          ACC_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACC_CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          ACC_CLOUDFLARE_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT }}
        run: |
          for n in CLOUDFLARE_API_TOKEN CLOUDFLARE_TOKEN CF_API_TOKEN CF_TOKEN; do
            v="$(eval echo \$TOK_$n)"
            if [ -n "$v" ]; then
              echo "token_name=$n" >> "$GITHUB_OUTPUT"
              echo "has_token=true"  >> "$GITHUB_OUTPUT"
              echo "Cloudflare token found under secret name: $n"
              break
            fi
          done
          if ! grep -q 'has_token=true' "$GITHUB_OUTPUT"; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::error::No Cloudflare API token secret found. Add one named CLOUDFLARE_API_TOKEN in repo Settings → Secrets, or use one of: CLOUDFLARE_TOKEN, CF_API_TOKEN, CF_TOKEN."
          fi

          for n in CLOUDFLARE_ACCOUNT_ID CF_ACCOUNT_ID CLOUDFLARE_ACCOUNT; do
            v="$(eval echo \$ACC_$n)"
            if [ -n "$v" ]; then
              echo "account_name=$n" >> "$GITHUB_OUTPUT"
              echo "has_account=true" >> "$GITHUB_OUTPUT"
              echo "Cloudflare account id found under secret name: $n"
              break
            fi
          done
          if ! grep -q 'has_account=true' "$GITHUB_OUTPUT"; then
            echo "has_account=false" >> "$GITHUB_OUTPUT"
            echo "::error::No Cloudflare account id secret found. Add one named CLOUDFLARE_ACCOUNT_ID (Cloudflare dashboard → right sidebar)."
          fi

  deploy:
    needs: bootstrap
    if: needs.bootstrap.outputs.has_token == 'true' && needs.bootstrap.outputs.has_account == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site:
          - { dir: carbteststockton,        project: carbteststockton }
          - { dir: cleantruckcheckroseville, project: cleantruckcheckroseville }
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Cloudflare credentials
        env:
          TOK_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOK_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          TOK_CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          TOK_CF_TOKEN: ${{ secrets.CF_TOKEN }}
          ACC_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACC_CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          ACC_CLOUDFLARE_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT }}
        run: |
          TOKEN="${TOK_CLOUDFLARE_API_TOKEN:-${TOK_CLOUDFLARE_TOKEN:-${TOK_CF_API_TOKEN:-$TOK_CF_TOKEN}}}"
          ACCOUNT="${ACC_CLOUDFLARE_ACCOUNT_ID:-${ACC_CF_ACCOUNT_ID:-$ACC_CLOUDFLARE_ACCOUNT}}"
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$ACCOUNT"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN"   >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT" >> "$GITHUB_ENV"

      - name: Ensure Pages project ${{ matrix.site.project }} exists
        run: |
          if npx --yes wrangler@latest pages project list 2>&1 | awk '{print $1}' | grep -qx "${{ matrix.site.project }}"; then
            echo "Pages project ${{ matrix.site.project }} already exists."
          else
            echo "Creating Pages project ${{ matrix.site.project }}..."
            npx --yes wrangler@latest pages project create "${{ matrix.site.project }}" \
              --production-branch=main
          fi

      - name: Deploy ${{ matrix.site.dir }} to ${{ matrix.site.project }}
        run: |
          BRANCH="${GITHUB_REF_NAME//\//-}"
          npx --yes wrangler@latest pages deploy "${{ matrix.site.dir }}" \
            --project-name "${{ matrix.site.project }}" \
            --branch "$BRANCH" \
            --commit-dirty=true
