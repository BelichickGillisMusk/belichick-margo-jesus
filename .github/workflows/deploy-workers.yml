name: Deploy Cloudflare Workers

on:
  push:
    branches:
      - main
      - claude/update-stockton-worker-JG6ZR
    paths:
      - 'workers/**'
      - '.github/workflows/deploy-workers.yml'
  workflow_dispatch:
    inputs:
      worker:
        description: 'Specific worker to deploy (leave blank for all ready ones)'
        required: false
        default: ''

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    outputs:
      has_token: ${{ steps.check.outputs.has_token }}
      has_account: ${{ steps.check.outputs.has_account }}
      token_name: ${{ steps.check.outputs.token_name }}
      account_name: ${{ steps.check.outputs.account_name }}
    steps:
      - name: Check required secrets (accept multiple name variants)
        id: check
        env:
          TOK_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOK_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          TOK_CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          TOK_CF_TOKEN: ${{ secrets.CF_TOKEN }}
          ACC_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACC_CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          ACC_CLOUDFLARE_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT }}
        run: |
          for n in CLOUDFLARE_API_TOKEN CLOUDFLARE_TOKEN CF_API_TOKEN CF_TOKEN; do
            v="$(eval echo \$TOK_$n)"
            if [ -n "$v" ]; then
              echo "token_name=$n" >> "$GITHUB_OUTPUT"
              echo "has_token=true"  >> "$GITHUB_OUTPUT"
              echo "Cloudflare token found under secret name: $n"
              break
            fi
          done
          if ! grep -q 'has_token=true' "$GITHUB_OUTPUT"; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::error::No Cloudflare API token secret found. Add one in repo Settings → Secrets (name it CLOUDFLARE_API_TOKEN), or use one of: CLOUDFLARE_TOKEN, CF_API_TOKEN, CF_TOKEN."
          fi

          for n in CLOUDFLARE_ACCOUNT_ID CF_ACCOUNT_ID CLOUDFLARE_ACCOUNT; do
            v="$(eval echo \$ACC_$n)"
            if [ -n "$v" ]; then
              echo "account_name=$n" >> "$GITHUB_OUTPUT"
              echo "has_account=true" >> "$GITHUB_OUTPUT"
              echo "Cloudflare account id found under secret name: $n"
              break
            fi
          done
          if ! grep -q 'has_account=true' "$GITHUB_OUTPUT"; then
            echo "has_account=false" >> "$GITHUB_OUTPUT"
            echo "::error::No Cloudflare account id secret found. Add one named CLOUDFLARE_ACCOUNT_ID (get the value from the Cloudflare dashboard sidebar)."
          fi

  bootstrap_resources:
    runs-on: ubuntu-latest
    needs: bootstrap
    if: needs.bootstrap.outputs.has_token == 'true' && needs.bootstrap.outputs.has_account == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Resolve Cloudflare credentials
        id: creds
        env:
          TOK_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOK_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          TOK_CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          TOK_CF_TOKEN: ${{ secrets.CF_TOKEN }}
          ACC_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACC_CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          ACC_CLOUDFLARE_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT }}
        run: |
          TOKEN="${TOK_CLOUDFLARE_API_TOKEN:-${TOK_CLOUDFLARE_TOKEN:-${TOK_CF_API_TOKEN:-$TOK_CF_TOKEN}}}"
          ACCOUNT="${ACC_CLOUDFLARE_ACCOUNT_ID:-${ACC_CF_ACCOUNT_ID:-$ACC_CLOUDFLARE_ACCOUNT}}"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN"   >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT" >> "$GITHUB_ENV"
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$ACCOUNT"
      - name: Ensure R2 bucket `form-submissions` exists
        run: |
          npx --yes wrangler@latest r2 bucket create form-submissions 2>&1 | tee out.log || \
            grep -qi 'already exists\|bucket with that name' out.log
      - name: Apply D1 migration to `norcal-carb-leads`
        run: |
          npx --yes wrangler@latest d1 execute norcal-carb-leads \
            --remote --file=workers/migrations/0001_leads.sql

  deploy:
    runs-on: ubuntu-latest
    needs: [bootstrap, bootstrap_resources]
    if: needs.bootstrap.outputs.has_token == 'true' && needs.bootstrap.outputs.has_account == 'true'
    strategy:
      fail-fast: false
      matrix:
        worker:
          - stockton-carb-worker
          - cleantruckcheck-fairfield
          - mobilecarbsmoketest
          - mobilecarbtest
          - cleantruckcheck-roseville
          - cleantruckcheckhayward
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Skip if manual dispatch targeted a different worker
        id: gate
        run: |
          INPUT='${{ github.event.inputs.worker }}'
          if [ -n "$INPUT" ] && [ "$INPUT" != "${{ matrix.worker }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if wrangler.toml not yet active (still .template)
        id: configgate
        if: steps.gate.outputs.skip != 'true'
        working-directory: workers/${{ matrix.worker }}
        run: |
          if [ ! -f wrangler.toml ]; then
            echo "::notice::${{ matrix.worker }} has no wrangler.toml (still .template). Fill in the KV id and rename to activate."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve Cloudflare credentials
        id: creds
        if: steps.gate.outputs.skip != 'true' && steps.configgate.outputs.skip != 'true'
        env:
          TOK_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOK_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          TOK_CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          TOK_CF_TOKEN: ${{ secrets.CF_TOKEN }}
          ACC_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACC_CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          ACC_CLOUDFLARE_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT }}
        run: |
          TOKEN="${TOK_CLOUDFLARE_API_TOKEN:-${TOK_CLOUDFLARE_TOKEN:-${TOK_CF_API_TOKEN:-$TOK_CF_TOKEN}}}"
          ACCOUNT="${ACC_CLOUDFLARE_ACCOUNT_ID:-${ACC_CF_ACCOUNT_ID:-$ACC_CLOUDFLARE_ACCOUNT}}"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN"   >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT" >> "$GITHUB_ENV"
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$ACCOUNT"

      - name: Deploy ${{ matrix.worker }}
        if: steps.gate.outputs.skip != 'true' && steps.configgate.outputs.skip != 'true'
        working-directory: workers/${{ matrix.worker }}
        run: |
          npx --yes wrangler@latest --version
          npx --yes wrangler@latest deploy
