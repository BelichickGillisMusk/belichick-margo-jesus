name: Deploy Cloudflare Workers

on:
  push:
    branches:
      - main
      - claude/update-stockton-worker-JG6ZR
    paths:
      - 'workers/**'
      - '.github/workflows/deploy-workers.yml'
  workflow_dispatch:
    inputs:
      worker:
        description: 'Specific worker to deploy (leave blank for all ready ones)'
        required: false
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        worker:
          - stockton-carb-worker
          - cleantruckcheck-fairfield
          - mobilecarbsmoketest
          - mobilecarbtest
          - cleantruckcheck-roseville
          - cleantruckcheckhayward
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Skip if manual dispatch targeted a different worker
        id: gate
        run: |
          INPUT='${{ github.event.inputs.worker }}'
          if [ -n "$INPUT" ] && [ "$INPUT" != "${{ matrix.worker }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if KV namespace id still a placeholder
        id: kvgate
        if: steps.gate.outputs.skip != 'true'
        working-directory: workers/${{ matrix.worker }}
        run: |
          if grep -q 'REPLACE_WITH_' wrangler.toml; then
            echo "::warning::${{ matrix.worker }} still has placeholder KV id; skipping deploy. Fill in wrangler.toml and re-run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy ${{ matrix.worker }}
        if: steps.gate.outputs.skip != 'true' && steps.kvgate.outputs.skip != 'true'
        working-directory: workers/${{ matrix.worker }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy
