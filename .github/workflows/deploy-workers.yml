name: Deploy Cloudflare Workers

on:
  push:
    branches:
      - main
      - claude/update-stockton-worker-JG6ZR
    paths:
      - 'workers/**'
      - '.github/workflows/deploy-workers.yml'
  workflow_dispatch:
    inputs:
      worker:
        description: 'Specific worker to deploy (leave blank for all ready ones)'
        required: false
        default: ''

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    outputs:
      has_token: ${{ steps.check.outputs.has_token }}
      has_account: ${{ steps.check.outputs.has_account }}
    steps:
      - name: Check required secrets
        id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN is set."
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set. Add it in repo Settings → Secrets and variables → Actions. If your secret is named differently (e.g. CLOUDFLARE_TOKEN), rename it or update this workflow."
          fi
          if [ -n "$ACCOUNT" ]; then
            echo "has_account=true" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_ACCOUNT_ID is set."
          else
            echo "has_account=false" >> "$GITHUB_OUTPUT"
            echo "::error::CLOUDFLARE_ACCOUNT_ID secret is not set."
          fi

  bootstrap_resources:
    runs-on: ubuntu-latest
    needs: bootstrap
    if: needs.bootstrap.outputs.has_token == 'true' && needs.bootstrap.outputs.has_account == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Ensure R2 bucket `form-submissions` exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest r2 bucket create form-submissions 2>&1 | tee out.log || \
            grep -qi 'already exists\|bucket with that name' out.log
      - name: Apply D1 migration to `norcal-carb-leads`
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest d1 execute norcal-carb-leads \
            --remote --file=workers/migrations/0001_leads.sql

  deploy:
    runs-on: ubuntu-latest
    needs: [bootstrap, bootstrap_resources]
    if: needs.bootstrap.outputs.has_token == 'true' && needs.bootstrap.outputs.has_account == 'true'
    strategy:
      fail-fast: false
      matrix:
        worker:
          - stockton-carb-worker
          - cleantruckcheck-fairfield
          - mobilecarbsmoketest
          - mobilecarbtest
          - cleantruckcheck-roseville
          - cleantruckcheckhayward
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Skip if manual dispatch targeted a different worker
        id: gate
        run: |
          INPUT='${{ github.event.inputs.worker }}'
          if [ -n "$INPUT" ] && [ "$INPUT" != "${{ matrix.worker }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if wrangler.toml not yet active (still .template)
        id: configgate
        if: steps.gate.outputs.skip != 'true'
        working-directory: workers/${{ matrix.worker }}
        run: |
          if [ ! -f wrangler.toml ]; then
            echo "::notice::${{ matrix.worker }} has no wrangler.toml (still .template). Fill in the KV id and rename to activate."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy ${{ matrix.worker }}
        if: steps.gate.outputs.skip != 'true' && steps.configgate.outputs.skip != 'true'
        working-directory: workers/${{ matrix.worker }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest --version
          npx --yes wrangler@latest deploy
