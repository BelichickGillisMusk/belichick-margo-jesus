name: Node validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run smoke
      - run: npm run validate:html
      # Regenerates cloudflare/sites/<city>/index.html from sites-config.json and
      # fails if the committed files have drifted. Spreadsheet is the source of
      # truth — colors, phones, copy can only change via sites-config.json.
      - run: npm run sites:check
