<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Condoleezza">
<meta name="description" content="Condoleezza — executive assistant for Bryan Gillis">
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='6' fill='%23d4a017'/><circle cx='16' cy='16' r='13' fill='none' stroke='%23d4a017' stroke-opacity='.35'/></svg>">
<title>Condoleezza</title>
<style>
  :root {
    --bg: #060a12;
    --panel: #0d1220;
    --panel-2: #141928;
    --text: #e8e6df;
    --muted: #8a8878;
    --accent: #d4a017;
    --accent-dim: rgba(212,160,23,.15);
    --user: #1a2440;
    --bot: #141928;
    --danger: #ef4444;
    --safe: env(safe-area-inset-bottom, 0);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; height: 100dvh; }

  /* ── Header ── */
  header { padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 12px;
    display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid rgba(212,160,23,.18); background: var(--panel); }
  header .dot { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; flex-shrink: 0; }
  header .dot.offline { background: var(--danger); }
  header .dot.checking { background: #f59e0b; animation: pulse 1.2s infinite; }
  header h1 { font-size: 17px; font-weight: 700; margin: 0; letter-spacing: .01em; }
  header .sub { font-size: 12px; color: var(--muted); margin-left: auto; }
  header .settings-btn { background: none; border: none; cursor: pointer; color: var(--muted);
    font-size: 18px; padding: 4px; line-height: 1; flex-shrink: 0; }
  header .settings-btn:hover { color: var(--accent); }

  /* ── Chat log ── */
  #log { flex: 1; overflow-y: auto; padding: 12px 12px 4px; -webkit-overflow-scrolling: touch; }
  .msg { max-width: 86%; padding: 10px 13px; border-radius: 16px; margin: 6px 0;
    white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { background: var(--user); margin-left: auto; border-bottom-right-radius: 4px; }
  .msg.bot { background: var(--bot); border: 1px solid rgba(212,160,23,.12);
    margin-right: auto; border-bottom-left-radius: 4px; }
  .msg.sys { background: transparent; color: var(--muted); font-size: 12px; text-align: center;
    margin: 8px auto; max-width: 100%; }
  .msg.err { background: #3a1a1a; color: #ffd0d0; border: none; }

  /* ── Toolbar ── */
  .toolbar { display: flex; gap: 6px; padding: 4px 12px 0; font-size: 12px; color: var(--muted); }
  .toolbar label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .toolbar .spacer { flex: 1; }
  .toolbar a { color: var(--muted); text-decoration: underline; cursor: pointer; }

  /* ── Input form ── */
  form { display: flex; gap: 8px; padding: 8px 10px calc(8px + var(--safe));
    background: var(--panel); border-top: 1px solid rgba(212,160,23,.18); }
  textarea { flex: 1; resize: none; background: var(--panel-2); color: var(--text);
    border: 1px solid rgba(212,160,23,.2); border-radius: 14px; padding: 10px 12px; font: inherit;
    max-height: 140px; min-height: 44px; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { background: var(--accent); color: #060a12; border: none; border-radius: 14px;
    width: 48px; height: 48px; font-size: 20px; font-weight: 700; cursor: pointer; flex-shrink: 0; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.secondary { background: var(--panel-2); color: var(--text);
    border: 1px solid rgba(212,160,23,.2); }
  button.mic.listening { background: var(--danger); color: #fff; animation: pulse 1.2s infinite; }

  /* ── Typing indicator ── */
  .typing span { display: inline-block; width: 6px; height: 6px; margin: 0 2px;
    background: var(--muted); border-radius: 50%; animation: bounce 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 80%, 100% { transform: scale(.6); opacity: .4; }
    40% { transform: scale(1); opacity: 1; } }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }

  /* ── Setup overlay ── */
  #setup { display: flex; flex-direction: column; align-items: center; justify-content: center;
    flex: 1; padding: 24px; gap: 16px; text-align: center; }
  #setup h2 { font-size: 20px; color: var(--accent); margin: 0; }
  #setup p { color: var(--muted); font-size: 14px; max-width: 340px; margin: 0; line-height: 1.55; }
  #setup input { width: 100%; max-width: 400px; background: var(--panel-2); color: var(--text);
    border: 1px solid rgba(212,160,23,.3); border-radius: 10px; padding: 12px 14px;
    font: inherit; font-size: 14px; }
  #setup input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #setup input::placeholder { color: var(--muted); }
  #setup .save-btn { background: var(--accent); color: #060a12; border: none;
    border-radius: 10px; padding: 12px 28px; font: inherit; font-weight: 700;
    font-size: 15px; cursor: pointer; width: 100%; max-width: 400px; height: auto; }
  #setup .save-btn:hover { filter: brightness(1.1); }
  #setup .back-link { color: var(--muted); font-size: 13px; text-decoration: underline;
    cursor: pointer; background: none; border: none; }
  #setup code { font-family: monospace; background: var(--panel-2); padding: 2px 6px;
    border-radius: 4px; font-size: 13px; color: var(--accent); }
</style>
</head>
<body>

<header>
  <div class="dot checking" id="statusDot"></div>
  <h1>Condoleezza</h1>
  <div class="sub" id="status">connecting…</div>
  <button class="settings-btn" id="settingsBtn" title="Configure backend URL" aria-label="Settings">⚙</button>
</header>

<!-- Setup screen (shown on first run or when ⚙ is tapped) -->
<div id="setup" hidden>
  <h2>One-time setup</h2>
  <p>Paste the <strong>Google Cloud Run URL</strong> for the AI backend.<br>
     Find it at <code>console.cloud.google.com/run</code> → project <code>samantha</code>.</p>
  <p style="color:var(--muted);font-size:13px">Example: <code>https://samantha-abc123-ue.a.run.app</code></p>
  <input type="url" id="apiUrlInput" placeholder="https://samantha-……-ue.a.run.app" autocorrect="off" autocapitalize="off" spellcheck="false">
  <button class="save-btn" id="saveSetupBtn">Save &amp; Start</button>
  <button class="back-link" id="backBtn" hidden>← Back to chat</button>
</div>

<!-- Chat UI (hidden until setup is done) -->
<div id="chatWrap" style="display:none;flex-direction:column;flex:1;overflow:hidden">
  <div id="log" role="log" aria-live="polite"></div>
  <div class="toolbar">
    <label><input type="checkbox" id="speakToggle" checked> Speak replies</label>
    <span class="spacer"></span>
    <a id="clearBtn" role="button">Clear</a>
  </div>
  <form id="form" autocomplete="off">
    <button type="button" class="mic secondary" id="micBtn" title="Voice input" aria-label="Voice input">🎙</button>
    <textarea id="input" placeholder="Ask Condoleezza… (or tap 🎙 to talk)" rows="1" aria-label="Message"></textarea>
    <button type="submit" id="sendBtn" title="Send" aria-label="Send">↑</button>
  </form>
</div>

<script>
(() => {
  const API_KEY      = 'condi:api-url:v1';
  const HISTORY_KEY  = 'condi:history:v1';
  const SPEAK_KEY    = 'condi:speak:v1';
  const MAX_HISTORY  = 40;
  const PERSONA      = 'condoleezza';

  // ── DOM refs ──
  const setupEl     = document.getElementById('setup');
  const chatWrap    = document.getElementById('chatWrap');
  const apiUrlInput = document.getElementById('apiUrlInput');
  const saveSetupBtn= document.getElementById('saveSetupBtn');
  const backBtn     = document.getElementById('backBtn');
  const settingsBtn = document.getElementById('settingsBtn');
  const log         = document.getElementById('log');
  const form        = document.getElementById('form');
  const input       = document.getElementById('input');
  const sendBtn     = document.getElementById('sendBtn');
  const micBtn      = document.getElementById('micBtn');
  const speakToggle = document.getElementById('speakToggle');
  const clearBtn    = document.getElementById('clearBtn');
  const statusEl    = document.getElementById('status');
  const statusDot   = document.getElementById('statusDot');

  // ── State ──
  let apiUrl  = localStorage.getItem(API_KEY) || '';
  let history = [];

  // ── Setup flow ──
  function showSetup(showBack) {
    setupEl.hidden = false;
    chatWrap.style.display = 'none';
    apiUrlInput.value = apiUrl;
    backBtn.hidden = !showBack;
  }

  function showChat() {
    setupEl.hidden = true;
    chatWrap.style.display = 'flex';
    history = loadHistory();
    speakToggle.checked = localStorage.getItem(SPEAK_KEY) !== 'false';
    render();
    checkStatus();
  }

  function saveSetup() {
    const val = apiUrlInput.value.trim().replace(/\/$/, '');
    if (!val) { apiUrlInput.focus(); return; }
    try { new URL(val); } catch {
      apiUrlInput.setCustomValidity('Enter a valid URL (https://…)');
      apiUrlInput.reportValidity();
      return;
    }
    apiUrlInput.setCustomValidity('');
    apiUrl = val;
    localStorage.setItem(API_KEY, apiUrl);
    showChat();
  }

  saveSetupBtn.addEventListener('click', saveSetup);
  apiUrlInput.addEventListener('keydown', e => { if (e.key === 'Enter') saveSetup(); });
  backBtn.addEventListener('click', showChat);
  settingsBtn.addEventListener('click', () => showSetup(!!apiUrl));

  if (!apiUrl) {
    showSetup(false);
  } else {
    showChat();
  }

  // ── History persistence ──
  function loadHistory() {
    try {
      const raw = localStorage.getItem(HISTORY_KEY);
      if (!raw) return [];
      const parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed.slice(-MAX_HISTORY) : [];
    } catch { return []; }
  }
  function saveHistory() {
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(-MAX_HISTORY))); } catch {}
  }

  // ── Rendering ──
  function render() {
    log.innerHTML = '';
    if (history.length === 0) {
      addBubble('sys', 'Tap 🎙 and ask Condoleezza anything — email drafts, scheduling, ops, dispatch.');
      return;
    }
    for (const m of history) addBubble(m.role === 'user' ? 'user' : 'bot', m.content);
  }
  function addBubble(kind, text) {
    const el = document.createElement('div');
    el.className = 'msg ' + kind;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }
  function addTyping() {
    const el = document.createElement('div');
    el.className = 'msg bot';
    el.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  // ── Status check ──
  async function checkStatus() {
    statusDot.className = 'dot checking';
    statusEl.textContent = 'connecting…';
    try {
      // Shared backend endpoint — both personas route through the same Cloud Run service.
      const r = await fetch(`${apiUrl}/api/samantha/status`);
      const j = await r.json();
      if (j.ready) {
        statusEl.textContent = 'online';
        statusDot.className = 'dot';
      } else {
        statusEl.textContent = 'offline';
        statusDot.className = 'dot offline';
      }
    } catch {
      statusEl.textContent = 'unreachable';
      statusDot.className = 'dot offline';
    }
  }

  // ── Send / receive ──
  async function send(message) {
    if (!message.trim()) return;
    history.push({ role: 'user', content: message.trim() });
    saveHistory();
    addBubble('user', message.trim());
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;
    const typing = addTyping();
    try {
      const res = await fetch(`${apiUrl}/api/samantha/chat`, {
        // Condoleezza and Samantha share one Cloud Run backend; the `persona`
        // field selects which system prompt (and name) the AI uses.
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: message.trim(), history: history.slice(0, -1), persona: PERSONA }),
      });
      typing.remove();
      if (!res.ok) {
        let hint = '';
        if (res.status >= 500) hint = 'The backend hit an error — check Cloud Run logs.';
        else if (res.status === 503) hint = 'Backend is starting up or misconfigured — try again in a moment.';
        else if (res.status === 400) hint = 'Bad request — the message may be too long.';
        addBubble('err', `Condoleezza is unavailable (HTTP ${res.status}). ${hint}`);
        return;
      }
      const data = await res.json();
      const reply = data.reply || '(empty reply)';
      history.push({ role: 'assistant', content: reply });
      if (history.length > MAX_HISTORY) history = history.slice(-MAX_HISTORY);
      saveHistory();
      addBubble('bot', reply);
      if (speakToggle.checked) speak(reply);
    } catch (err) {
      typing.remove();
      addBubble('err', `Network error: ${err.message}`);
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  // ── Text-to-speech ──
  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 1.0;
      u.pitch = 1.0;
      window.speechSynthesis.speak(u);
    } catch {}
  }

  // ── Voice input (Web Speech API) ──
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let listening = false;

  if (SR) {
    recognition = new SR();
    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.lang = 'en-US';
    recognition.onresult = (e) => {
      let final = '', interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) final += r[0].transcript;
        else interim += r[0].transcript;
      }
      if (final) {
        input.value = (input.value + ' ' + final).trim();
      } else if (interim) {
        input.value = interim;
      }
    };
    recognition.onend = () => {
      listening = false;
      micBtn.classList.remove('listening');
      const text = input.value.trim();
      if (text) send(text);
    };
    recognition.onerror = (e) => {
      listening = false;
      micBtn.classList.remove('listening');
      if (e.error && e.error !== 'no-speech' && e.error !== 'aborted') {
        addBubble('err', `Mic error: ${e.error}. Tap 🎙 to retry, or type instead.`);
      }
    };
  } else {
    micBtn.disabled = true;
    micBtn.title = 'Voice input not supported on this browser';
  }

  micBtn.addEventListener('click', () => {
    if (!recognition) return;
    if (listening) { recognition.stop(); return; }
    try {
      input.value = '';
      listening = true;
      micBtn.classList.add('listening');
      recognition.start();
    } catch {
      listening = false;
      micBtn.classList.remove('listening');
    }
  });

  // ── Speak-toggle persistence ──
  speakToggle.addEventListener('change', () => {
    localStorage.setItem(SPEAK_KEY, speakToggle.checked ? 'true' : 'false');
  });

  // ── Auto-grow textarea ──
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });
  form.addEventListener('submit', (e) => { e.preventDefault(); send(input.value); });

  // ── Clear chat ──
  clearBtn.addEventListener('click', () => {
    history = [];
    saveHistory();
    render();
  });

  // ── Periodic status refresh ──
  setInterval(() => { if (apiUrl) checkStatus(); }, 30000);
})();
</script>
</body>
</html>
