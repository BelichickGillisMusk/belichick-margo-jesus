steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/mila-claude-2426-487008/raven-repo/raven-cloudrun:$COMMIT_SHA'
      - './raven-cloudrun'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/mila-claude-2426-487008/raven-repo/raven-cloudrun:$COMMIT_SHA'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'raven-cloudrun'
      - '--image=us-central1-docker.pkg.dev/mila-claude-2426-487008/raven-repo/raven-cloudrun:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=ANTHROPIC_API_KEY=${_ANTHROPIC_API_KEY},TELEGRAM_BOT_TOKEN=${_TELEGRAM_BOT_TOKEN},SMTP_HOST=${_SMTP_HOST},SMTP_USER=${_SMTP_USER},SMTP_PASS=${_SMTP_PASS},OWNER_EMAIL=${_OWNER_EMAIL},GITHUB_TOKEN=${_GITHUB_TOKEN},GITHUB_ORG=${_GITHUB_ORG},DAILY_COST_CAP=${_DAILY_COST_CAP},MONTHLY_COST_CAP=${_MONTHLY_COST_CAP},GOOGLE_CALENDAR_ID=${_GOOGLE_CALENDAR_ID}'
      - '--memory=256Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=3'
      - '--timeout=60s'
      - '--concurrency=80'

images:
  - 'us-central1-docker.pkg.dev/mila-claude-2426-487008/raven-repo/raven-cloudrun:$COMMIT_SHA'
