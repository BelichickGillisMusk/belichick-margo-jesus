<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bot Rankings - GIA</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  :root{
    --bg:#0a0d12;
    --bg2:#0e1117;
    --panel:#161b22;
    --border:#21262d;
    --text:#e6edf3;
    --text-dim:#7d8590;
    --accent:#58a6ff;
    --accent-glow:rgba(88,166,255,.25);
    --green:#3fb950;
    --green-glow:rgba(63,185,80,.2);
    --gold:#d29922;
    --gold-glow:rgba(210,153,34,.25);
    --red:#f85149;
    --red-glow:rgba(248,81,73,.2);
    --gradient:linear-gradient(135deg,#58a6ff 0%,#3fb950 100%);
  }

  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.6;
  }

  /* ── NAV ── */
  nav{
    position:sticky;top:0;z-index:100;
    background:rgba(10,13,18,.9);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
    padding:0 24px;
  }

  .nav-inner{
    max-width:1200px;margin:0 auto;
    display:flex;align-items:center;justify-content:space-between;
    height:56px;
  }

  .logo{font-size:1.2rem;font-weight:800;letter-spacing:.08em}
  .logo a{text-decoration:none}
  .logo .gia{background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  .logo .sub{color:var(--text-dim);font-weight:400;font-size:.75rem;margin-left:8px;letter-spacing:.04em}

  .nav-links{display:flex;gap:20px}
  .nav-links a{color:var(--text-dim);text-decoration:none;font-size:.82rem;transition:color .2s}
  .nav-links a:hover{color:var(--text)}

  /* ── HEADER ── */
  .page-header{
    max-width:1200px;margin:0 auto;
    padding:48px 24px 24px;
  }

  .page-header h1{
    font-size:2rem;font-weight:700;margin-bottom:4px;
  }

  .page-header p{
    color:var(--text-dim);font-size:.95rem;
  }

  /* ── FILTERS ── */
  .filters{
    max-width:1200px;margin:0 auto;
    padding:0 24px 24px;
    display:flex;gap:8px;flex-wrap:wrap;
  }

  .filter-btn{
    padding:6px 14px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:20px;
    color:var(--text-dim);
    font-size:.78rem;
    cursor:pointer;
    transition:all .2s;
  }
  .filter-btn:hover,.filter-btn.active{
    border-color:var(--accent);color:var(--accent);
    background:rgba(88,166,255,.08);
  }

  /* ── BOT TABLE ── */
  .bot-grid{
    max-width:1200px;margin:0 auto;
    padding:0 24px 60px;
    display:flex;flex-direction:column;
    gap:12px;
  }

  .bot-row{
    display:grid;
    grid-template-columns:50px 1fr 140px 200px 120px 100px;
    align-items:center;
    gap:16px;
    padding:20px 24px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    transition:all .3s;
  }

  .bot-row:hover{
    border-color:rgba(88,166,255,.3);
    box-shadow:0 0 20px rgba(88,166,255,.06);
  }

  .bot-rank{
    font-size:1.8rem;font-weight:800;
    color:var(--text-dim);
    text-align:center;
  }

  .bot-row:nth-child(1) .bot-rank{color:var(--gold)}
  .bot-row:nth-child(2) .bot-rank{color:#c0c0c0}
  .bot-row:nth-child(3) .bot-rank{color:#cd7f32}

  .bot-info{display:flex;flex-direction:column;gap:2px}

  .bot-info .name{
    font-size:1.05rem;font-weight:600;
    display:flex;align-items:center;gap:8px;
  }

  .bot-info .role{
    font-size:.75rem;color:var(--accent);
    text-transform:uppercase;letter-spacing:.06em;
  }

  .bot-info .desc{
    font-size:.8rem;color:var(--text-dim);
    margin-top:2px;
  }

  /* ── STATUS BADGE ── */
  .bot-status{text-align:center}

  .status-badge{
    display:inline-flex;align-items:center;gap:5px;
    padding:4px 12px;
    border-radius:12px;
    font-size:.72rem;font-weight:600;
    text-transform:uppercase;
    letter-spacing:.04em;
  }

  .status-badge.deployed{
    background:rgba(63,185,80,.12);
    color:var(--green);
    border:1px solid rgba(63,185,80,.25);
  }

  .status-badge.building{
    background:rgba(210,153,34,.12);
    color:var(--gold);
    border:1px solid rgba(210,153,34,.25);
  }

  .status-badge.planned{
    background:rgba(88,166,255,.1);
    color:var(--accent);
    border:1px solid rgba(88,166,255,.2);
  }

  .status-badge.needs-work{
    background:rgba(248,81,73,.1);
    color:var(--red);
    border:1px solid rgba(248,81,73,.2);
  }

  .status-badge::before{
    content:'';width:6px;height:6px;border-radius:50%;
  }

  .status-badge.deployed::before{background:var(--green);box-shadow:0 0 6px var(--green-glow)}
  .status-badge.building::before{background:var(--gold);box-shadow:0 0 6px var(--gold-glow)}
  .status-badge.planned::before{background:var(--accent);box-shadow:0 0 6px var(--accent-glow)}
  .status-badge.needs-work::before{background:var(--red);box-shadow:0 0 6px var(--red-glow)}

  /* ── SKILLS BAR ── */
  .bot-skills{display:flex;flex-direction:column;gap:4px}

  .skill-row{
    display:flex;align-items:center;gap:6px;
    font-size:.68rem;
    color:var(--text-dim);
  }

  .skill-label{width:60px;text-align:right;flex-shrink:0}

  .skill-bar-bg{
    flex:1;height:6px;
    background:var(--bg);
    border-radius:3px;
    overflow:hidden;
  }

  .skill-bar{
    height:100%;border-radius:3px;
    transition:width .6s ease-out;
  }

  .skill-bar.high{background:var(--green)}
  .skill-bar.mid{background:var(--gold)}
  .skill-bar.low{background:var(--red)}

  /* ── PROJECTS ── */
  .bot-projects{
    display:flex;flex-wrap:wrap;gap:4px;
  }

  .project-tag{
    padding:2px 8px;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:4px;
    font-size:.65rem;
    color:var(--text-dim);
    white-space:nowrap;
  }

  /* ── POWER SCORE ── */
  .bot-power{
    text-align:center;
  }

  .power-score{
    font-size:1.6rem;font-weight:800;
    line-height:1;
  }

  .power-label{
    font-size:.6rem;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:.08em;
  }

  .power-score.s-tier{color:var(--gold)}
  .power-score.a-tier{color:var(--green)}
  .power-score.b-tier{color:var(--accent)}
  .power-score.c-tier{color:var(--red)}

  /* ── LEGEND ── */
  .legend{
    max-width:1200px;margin:0 auto;
    padding:0 24px 40px;
    display:flex;gap:20px;flex-wrap:wrap;
    font-size:.72rem;color:var(--text-dim);
  }

  .legend-item{display:flex;align-items:center;gap:6px}
  .legend-dot{width:8px;height:8px;border-radius:50%}

  /* ── RESPONSIVE ── */
  @media(max-width:900px){
    .bot-row{
      grid-template-columns:40px 1fr;
      grid-template-rows:auto auto auto;
      gap:8px;
    }
    .bot-status,.bot-skills,.bot-projects,.bot-power{
      grid-column:1/-1;
    }
  }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <div class="logo"><a href="/"><span class="gia">GIA</span></a><span class="sub">Bot Rankings</span></div>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/dashboard.html">Dashboard</a>
      <a href="/salesbot.html">Sales Demo</a>
    </div>
  </div>
</nav>

<div class="page-header">
  <h1>Bot Rankings &amp; Projects</h1>
  <p>Power scores based on skills deployed, projects assigned, and readiness level. Red = needs more skills. Gold = top performer.</p>
</div>

<div class="filters">
  <button class="filter-btn active" onclick="filterBots('all')">All Agents</button>
  <button class="filter-btn" onclick="filterBots('deployed')">Deployed</button>
  <button class="filter-btn" onclick="filterBots('building')">Building</button>
  <button class="filter-btn" onclick="filterBots('needs-work')">Needs Work</button>
</div>

<div class="bot-grid" id="botGrid"></div>

<div class="legend">
  <div class="legend-item"><span class="legend-dot" style="background:var(--gold)"></span> S-Tier (90+)</div>
  <div class="legend-item"><span class="legend-dot" style="background:var(--green)"></span> A-Tier (70-89)</div>
  <div class="legend-item"><span class="legend-dot" style="background:var(--accent)"></span> B-Tier (50-69)</div>
  <div class="legend-item"><span class="legend-dot" style="background:var(--red)"></span> C-Tier (&lt;50)</div>
</div>

<script>
const bots = [
  {
    name: 'Jon Jones',
    emoji: '\u{1F6E1}\uFE0F',
    role: 'Security Guardian',
    desc: 'Gatekeeps all outbound actions. PII scan, legal review, tone check.',
    status: 'deployed',
    skills: { security: 95, prompts: 90, tools: 85 },
    projects: ['Outbound Gate', 'Audit Logs', 'Slack Filter', 'Email Gate'],
    power: 92,
  },
  {
    name: 'Belichick',
    emoji: '\u{1F3C8}',
    role: 'Strategy & Operations',
    desc: 'Orchestrates all agents. Email, calendar, task delegation, decision-making.',
    status: 'deployed',
    skills: { security: 80, prompts: 95, tools: 90 },
    projects: ['Agent Coord', 'Email Mgmt', 'Calendar', 'Task Queue'],
    power: 90,
  },
  {
    name: 'Closer',
    emoji: '\u{1F4BC}',
    role: 'Sales Agent',
    desc: 'A.C.E.S. framework. Cold calls, email sequences, objection handling.',
    status: 'deployed',
    skills: { security: 70, prompts: 92, tools: 65 },
    projects: ['Cold Email', 'Lead Qualify', 'Objection DB', 'Slack Sales'],
    power: 78,
  },
  {
    name: 'Mila',
    emoji: '\u{1F4CA}',
    role: 'Customer Service & Legal',
    desc: 'CARB compliance CS bot + regulatory research for business opps.',
    status: 'building',
    skills: { security: 75, prompts: 85, tools: 60 },
    projects: ['CARB CS Bot', 'Legal Research', 'Lead Capture', 'Calendar Sync'],
    power: 72,
  },
  {
    name: 'Nova',
    emoji: '\u{1F3AC}',
    role: 'Marketing & Content',
    desc: 'YouTube, social, SEO, animation planning, content calendar.',
    status: 'building',
    skills: { security: 50, prompts: 80, tools: 55 },
    projects: ['YouTube Scripts', 'Social Posts', 'SEO Audit'],
    power: 62,
  },
  {
    name: 'Cipher',
    emoji: '\u{1F4B0}',
    role: 'Finance & Accounting',
    desc: 'Bookkeeping, invoicing (Stripe), tax prep, budget forecasting.',
    status: 'building',
    skills: { security: 60, prompts: 70, tools: 45 },
    projects: ['Stripe Invoicing', 'Expense Track', 'Tax Prep'],
    power: 58,
  },
  {
    name: 'Atlas',
    emoji: '\u{1F5FA}\uFE0F',
    role: 'Web Dev & Technical',
    desc: 'Website builds, deployments, bug fixes, API integrations.',
    status: 'needs-work',
    skills: { security: 55, prompts: 65, tools: 40 },
    projects: ['Site Deploy', 'API Hookups'],
    power: 50,
  },
  {
    name: 'Sentinel',
    emoji: '\u2696\uFE0F',
    role: 'Legal & Regulatory',
    desc: 'Finds business opps in laws. Federal, state, local research.',
    status: 'needs-work',
    skills: { security: 45, prompts: 60, tools: 35 },
    projects: ['CARB Monitor', 'License Lookup'],
    power: 42,
  },
  {
    name: 'Lead Scraper',
    emoji: '\u{1F50D}',
    role: 'Google Maps Data',
    desc: 'Pulls business contacts from Google Maps/Places API for lead lists.',
    status: 'needs-work',
    skills: { security: 40, prompts: 50, tools: 30 },
    projects: ['Maps Scrape', 'Sheet Export'],
    power: 38,
  },
];

function tierClass(score) {
  if (score >= 90) return 's-tier';
  if (score >= 70) return 'a-tier';
  if (score >= 50) return 'b-tier';
  return 'c-tier';
}

function barClass(val) {
  if (val >= 75) return 'high';
  if (val >= 50) return 'mid';
  return 'low';
}

function renderBots(filter) {
  const grid = document.getElementById('botGrid');
  const filtered = filter === 'all' ? bots : bots.filter(b => b.status === filter);

  grid.innerHTML = filtered.map((b, i) => `
    <div class="bot-row" data-status="${b.status}">
      <div class="bot-rank">${i + 1}</div>
      <div class="bot-info">
        <div class="name">${b.emoji} ${b.name}</div>
        <div class="role">${b.role}</div>
        <div class="desc">${b.desc}</div>
      </div>
      <div class="bot-status">
        <span class="status-badge ${b.status}">${b.status.replace('-', ' ')}</span>
      </div>
      <div class="bot-skills">
        ${Object.entries(b.skills).map(([k, v]) => `
          <div class="skill-row">
            <span class="skill-label">${k}</span>
            <div class="skill-bar-bg">
              <div class="skill-bar ${barClass(v)}" style="width:${v}%"></div>
            </div>
          </div>
        `).join('')}
      </div>
      <div class="bot-projects">
        ${b.projects.map(p => `<span class="project-tag">${p}</span>`).join('')}
      </div>
      <div class="bot-power">
        <div class="power-score ${tierClass(b.power)}">${b.power}</div>
        <div class="power-label">Power</div>
      </div>
    </div>
  `).join('');
}

function filterBots(status) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderBots(status);
}

renderBots('all');
</script>
</body>
</html>
