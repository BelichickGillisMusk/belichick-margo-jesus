name = "mobilecarbsmoketest"
main = "src/index.ts"
compatibility_date = "2026-04-01"

routes = [
  { pattern = "mobilecarbsmoketest.com/*", zone_name = "mobilecarbsmoketest.com" },
  { pattern = "www.mobilecarbsmoketest.com/*", zone_name = "mobilecarbsmoketest.com" },
]

# TODO(deploy): replace `id` with San Diego's isolated KV namespace.
# Create one if it does not exist:
#   wrangler kv namespace create SMOKETEST_HTML_STORE
[[kv_namespaces]]
binding = "SMOKETEST_HTML_STORE"
id      = "REPLACE_WITH_SMOKETEST_KV_ID"

[[d1_databases]]
binding       = "LEADS_DB"
database_name = "norcal-carb-leads"
database_id   = "ded9f851-2944-4f66-97de-e88c6b7bd9c9"

[[r2_buckets]]
binding     = "FORM_SUBMISSIONS"
bucket_name = "form-submissions"
